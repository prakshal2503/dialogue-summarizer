<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Deleted</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0e1a; color: #e2e8f0;
    min-height: 100vh; display:flex; align-items:center; justify-content:center;
  }
  .box {
    text-align: center; max-width: 440px; padding: 40px;
    background: #111827; border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
  }
  .icon { font-size: 56px; display:block; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.8; margin-bottom: 20px; }
  .note {
    background: rgba(16,185,129,0.07); border: 1px solid rgba(16,185,129,0.2);
    border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #6ee7b7;
    margin-bottom: 24px; text-align: left;
  }
  a {
    display: inline-block; padding: 12px 28px;
    background: linear-gradient(135deg, #00d4aa, #7c3aed);
    color: #fff; text-decoration: none; border-radius: 8px;
    font-weight: 600; font-size: 14px;
  }
</style>
</head>
<body>
<div class="box">
  <span class="icon">👋</span>
  <h1>Account Deleted</h1>
  <p>Your account has been permanently deleted. All your data and history have been removed from the platform.</p>
  <div class="note">
    ✓ A security audit record has been preserved for compliance purposes (admin-visible only).<br>
    ✓ You have been signed out.
  </div>
  <a href="/login/">Back to Login</a>
</div>
</body>
</html>
